name: bench

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'cmd/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'resources/**'
      - 'test/test.js'
      - 'test/smoke.js'
      - 'test/test-data.json'
      - 'scripts/update-readme-bench.py'
      - '.github/workflows/bench.yml'
  workflow_dispatch:
    inputs:
      index_nlist:
        description: IVF nlist/K to generate
        required: true
        default: '8192'
        type: choice
        options:
          - '4096'
          - '8192'
          - '16384'
      base_nprobe:
        description: Base nprobe
        required: true
        default: '20'
        type: string
      ambig_nprobe:
        description: Ambiguous nprobe
        required: true
        default: '40'
        type: string
      bbox_mode:
        description: BBox repair mode
        required: true
        default: ambiguous-only
        type: choice
        options:
          - 'off'
          - 'ambiguous-only'
          - 'always'
      use_exact_fallback:
        description: Enable exact fallback
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      use_fast_path:
        description: Enable fast-path classifier before ANN
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      workers:
        description: API workers per replica
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '4'

permissions:
  contents: write

concurrency:
  group: bench-main
  cancel-in-progress: false

jobs:
  k6:
    name: docker-compose smoke + k6 benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INDEX_NLIST: ${{ inputs.index_nlist || '8192' }}
      BASE_NPROBE: ${{ inputs.base_nprobe || '20' }}
      AMBIG_NPROBE: ${{ inputs.ambig_nprobe || '40' }}
      BBOX_MODE: ${{ inputs.bbox_mode || 'ambiguous-only' }}
      USE_EXACT_FALLBACK: ${{ inputs.use_exact_fallback || '0' }}
      USE_FAST_PATH: ${{ inputs.use_fast_path || '0' }}
      WORKERS: ${{ inputs.workers || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show amd64 runner
        run: |
          uname -a
          test "$(uname -m)" = "x86_64"
          lscpu | sed -n '1,60p'
          docker version
          docker compose version

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zlib1g-dev curl gnupg ca-certificates

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | \
            sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Build binary
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake -j --target build-index fraud-server

      - name: Generate IVF index
        run: |
          mkdir -p build
          echo "Generating index_k${INDEX_NLIST}.ivfi16"
          ./build-cmake/build-index \
            --references resources/references.json.gz \
            --out "build/index_k${INDEX_NLIST}.ivfi16" \
            --nlist "${INDEX_NLIST}"

      - name: Start docker-compose stack
        run: |
          docker compose down --remove-orphans || true
          export INDEX_PATH="/app/build/index_k${INDEX_NLIST}.ivfi16"
          echo "Benchmark config: INDEX_PATH=${INDEX_PATH} BASE_NPROBE=${BASE_NPROBE} AMBIG_NPROBE=${AMBIG_NPROBE} BBOX_MODE=${BBOX_MODE} USE_EXACT_FALLBACK=${USE_EXACT_FALLBACK} USE_FAST_PATH=${USE_FAST_PATH} WORKERS=${WORKERS}"
          docker compose config
          docker compose up --build -d
          for i in $(seq 1 90); do
            if curl -sf http://localhost:9999/ready >/dev/null; then
              echo "stack ready after ${i}s"
              docker compose ps
              for id in $(docker compose ps -q); do
                docker inspect "$id" \
                  --format '{{.Name}} NanoCpus={{.HostConfig.NanoCpus}} Memory={{.HostConfig.Memory}}'
              done
              exit 0
            fi
            sleep 1
          done
          echo "stack failed to become ready"
          docker compose logs
          exit 1

      - name: k6 smoke
        run: k6 run test/smoke.js

      - name: k6 benchmark
        run: k6 run test/test.js

      - name: Collect benchmark artifacts
        if: always()
        run: |
          mkdir -p bench/artifacts
          {
            echo "INDEX_NLIST=${INDEX_NLIST}"
            echo "BASE_NPROBE=${BASE_NPROBE}"
            echo "AMBIG_NPROBE=${AMBIG_NPROBE}"
            echo "BBOX_MODE=${BBOX_MODE}"
            echo "USE_EXACT_FALLBACK=${USE_EXACT_FALLBACK}"
            echo "USE_FAST_PATH=${USE_FAST_PATH}"
            echo "WORKERS=${WORKERS}"
          } > bench/artifacts/bench-config.env
          cp test/results.json bench/artifacts/results.json 2>/dev/null || true
          docker compose ps > bench/artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > bench/artifacts/compose.log 2>&1 || true
          docker stats --no-stream > bench/artifacts/docker-stats.txt 2>&1 || true
          docker compose config > bench/artifacts/compose-config.yml 2>&1 || true
          uname -a > bench/artifacts/uname.txt
          lscpu > bench/artifacts/lscpu.txt 2>&1 || true

      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-amd64-k${{ env.INDEX_NLIST }}-p${{ env.BASE_NPROBE }}-${{ env.AMBIG_NPROBE }}-${{ env.BBOX_MODE }}
          path: bench/artifacts/
          if-no-files-found: warn

      - name: Embed results in README
        run: python3 scripts/update-readme-bench.py

      - name: Commit and push
        run: |
          if git diff --quiet -- README.md test/results.json; then
            echo "no benchmark drift to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md test/results.json
          git commit -m "chore(bench): update readme with latest k6 results [skip ci]"
          # Drop any other tracked-file drift from the build/run so rebase is clean.
          git checkout -- .
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying"
            git fetch origin main
            git status --porcelain
            git rebase origin/main || { git rebase --abort 2>/dev/null || true; exit 1; }
            sleep $((attempt * 5))
          done
          echo "gave up after 5 push attempts"
          exit 1
