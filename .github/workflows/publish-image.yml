name: publish-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux-amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/leofmarciano/rinha-de-backend-2026:submission-amd64
            ghcr.io/leofmarciano/rinha-de-backend-2026:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/leofmarciano/rinha-de-backend-2026
            org.opencontainers.image.description=Rinha Backend 2026 native IVF submission
