services:
  lb:
    image: haproxy:3.0-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "24MB"

  api1:
    build: .
    environment: &api-env
      PORT: "8080"
      SOCKET_PATH: "/sockets/api1.sock"
      INDEX_PATH: "${INDEX_PATH:-/app/build/index_k8192.ivfi16}"
      BASE_NPROBE: "${BASE_NPROBE:-20}"
      AMBIG_NPROBE: "${AMBIG_NPROBE:-40}"
      BBOX_MODE: "${BBOX_MODE:-ambiguous-only}"
      USE_EXACT_FALLBACK: "${USE_EXACT_FALLBACK:-0}"
      USE_FAST_PATH: "${USE_FAST_PATH:-0}"
      HEURISTIC_ONLY: "0"
      WARMUP: "full"
      WORKERS: "${WORKERS:-1}"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "163MB"

  api2:
    build: .
    environment:
      <<: *api-env
      SOCKET_PATH: "/sockets/api2.sock"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "163MB"

volumes:
  sockets:
