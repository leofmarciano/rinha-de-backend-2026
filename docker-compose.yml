services:
  lb:
    image: haproxy:3.0-alpine
    cpus: "0.20"
    mem_limit: "24MB"
    ports:
      - "9999:9999"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "24MB"

  api1:
    image: ghcr.io/leofmarciano/rinha-de-backend-2026:952388625da4ff2feedc39b50fc32651b8c3ece0
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpus: "0.40"
    mem_limit: "163MB"
    environment: &api-env
      PORT: "8080"
      SOCKET_PATH: "/sockets/api1.sock"
      INDEX_PATH: "/app/build/index_k512_kmeans.ivfi16"
      BASE_NPROBE: "1"
      AMBIG_NPROBE: "1"
      BBOX_MODE: "ambiguous-only"
      USE_EXACT_FALLBACK: "0"
      USE_FAST_PATH: "0"
      USE_IOURING: "1"
      HEURISTIC_ONLY: "0"
      WARMUP: "full"
      WORKERS: "1"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "163MB"

  api2:
    image: ghcr.io/leofmarciano/rinha-de-backend-2026:952388625da4ff2feedc39b50fc32651b8c3ece0
    platform: linux/amd64
    security_opt:
      - seccomp=unconfined
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpus: "0.40"
    mem_limit: "163MB"
    environment:
      <<: *api-env
      SOCKET_PATH: "/sockets/api2.sock"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "163MB"

volumes:
  sockets:
